<div id="loginOverlay">
  <div class="login-card">
    <h2>🔐 เข้าสู่ระบบ IT Inventory</h2>
    <div style="margin-bottom: 10px;">
      <label>อีเมลผู้ใช้งาน (Email)</label>
      <!-- เปลี่ยน id และ placeholder เป็นอีเมล -->
      <input type="email" id="loginUser" placeholder="เช่น admin@company.com">
    </div>
    <div style="margin-bottom: 14px;">
      <label>รหัสผ่าน (Password)</label>
      <input type="password" id="loginPass" placeholder="รหัสผ่านอย่างน้อย 8 ตัวอักษร">
    </div>
    <button class="b" style="width:100%" onclick="handleLogin()">เข้าสู่ระบบ</button>
    <p id="loginMsg" style="color:var(--bad); font-size:13px; text-align:center; margin-top:8px; min-height:18px;"></p>
  </div>
</div>
