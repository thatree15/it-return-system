<div id="loginOverlay">
  <div class="login-card">
    <h2>🔐 เข้าสู่ระบบด้วย OTP</h2>
    
    <!-- สเต็ป 1: กรอกอีเมลเพื่อขอรหัส -->
    <div id="step1">
      <div style="margin-bottom: 14px;">
        <label>อีเมลผู้ใช้งาน (Email)</label>
        <input type="email" id="loginUser" placeholder="เช่น admin@company.com">
      </div>
      <button class="b" style="width:100%" onclick="requestOTP()">รับรหัส 6 หลักผ่านอีเมล</button>
    </div>

    <!-- สเต็ป 2: กรอกรหัส 6 หลัก (ซ่อนไว้ก่อน) -->
    <div id="step2" style="display:none;">
      <div style="margin-bottom: 14px;">
        <label>รหัส OTP (6 หลักจากอีเมล)</label>
        <input type="text" id="loginOTP" placeholder="กรอกรหัส 6 หลัก" maxlength="6" style="text-align:center; font-size:18px; letter-spacing:4px;">
      </div>
      <button class="b" style="width:100%" onclick="verifyOTP()">เข้าสู่ระบบ</button>
      <button class="b s" style="width:100%; margin-top:8px;" onclick="cancelOTP()">ยกเลิก / กลับ</button>
    </div>

    <p id="loginMsg" style="color:var(--bad); font-size:13px; text-align:center; margin-top:12px; min-height:18px;"></p>
  </div>
</div>
